<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Name</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .card {
            background: white;
            width: 350px;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
        }

        img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 15px;
        }

        h1 {
            margin: 10px 0;
        }

        p {
            color: #666;
        }

        .btn {
            display: block;
            margin: 12px 0;
            padding: 14px;
            text-decoration: none;
            border-radius: 8px;
            color: white;
            font-weight: bold;
        }

        .call { background: #28a745; }
        .email { background: #007bff; }
        .linkedin { background: #0A66C2; }
        .save { background: #ff6b35; }
    </style>
</head>
<body>

<div class="card">

    <img src="profile.jpg" alt="Profile">

    <h1>Your Name</h1>

    <p>Software Engineer | HDFC Bank</p>

    <a class="btn call" href="tel:+919876543210">
        📞 Call Me
    </a>

    <a class="btn email" href="mailto:your.email@example.com">
        ✉️ Send Email
    </a>

    <a class="btn linkedin" href="https://linkedin.com/in/yourprofile">
        🔗 LinkedIn
    </a>

    <a class="btn save" href="contact.vcf">
        💾 Save Contact
    </a>

</div>

</body>
</html>
